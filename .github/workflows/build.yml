name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # IEEE vendor registry, bundled so Wi-Fi / Bluetooth addresses can be mapped to makers.
      # If the download fails the app still builds; vendor names from addresses are just skipped.
      - name: Download IEEE vendor registry
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/oui.csv https://standards-oui.ieee.org/oui/oui.csv || rm -f app/src/main/assets/oui.csv

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: rfscout-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Tag a release (git tag v0.1.0 && git push --tags) to get the APK as a direct download link
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
